<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generador interactivo de paletas de colores para Colorfly Studio.">
  <title>Colorfly Studio | Generador de Paletas</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="site-header">
    <div class="container">
      <p class="eyebrow">COLORFLY STUDIO</p>
      <h1>Generador de Paletas</h1>
      <p class="subtitle">
        Crea combinaciones de color aleatorias de forma rápida y sencilla.
      </p>
    </div>
  </header>

  <main class="container">

    <section class="controls" aria-labelledby="controls-title">

      <div>
        <h2 id="controls-title">Configuración</h2>
        <p class="help-text">
          Elige cuántos colores quieres generar.
        </p>
      </div>

      <div class="control-group">

        <label for="palette-size">
          Tamaño de la paleta
        </label>

        <select id="palette-size" name="palette-size">
          <option value="6">6 colores</option>
          <option value="8">8 colores</option>
          <option value="9">9 colores</option>
        </select>

        <button id="generate-button" type="button" aria-label="Generar una nueva paleta de colores">
            Generar paleta
        </button>

      </div>
    </section>

    <section class="palette-section" aria-labelledby="palette-title">

      <div class="section-heading">
        <div>
          <h2 id="palette-title">Tu paleta</h2>

          <p id="palette-status" class="status" aria-live="polite">
            Genera una paleta para comenzar.
          </p>
        </div>
      </div>

      <div
        id="palette"
        class="palette"
        aria-label="Colores generados">
      </div>

    </section>

  </main>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
    aria-atomic="true">
  </div>

  <footer class="site-footer">
    <p>Proyecto Integrador 1 · Frontend Fundamentals</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
